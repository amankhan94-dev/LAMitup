kind = "web"
previewPath = "/"
title = "LAMitup Website"
version = "1.0.0"
id = "artifacts/lamitup"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19138

[services.development]
run = "pnpm --filter @workspace/lamitup run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lamitup", "run", "build" ]
serve = "static"
publicDir = "artifacts/lamitup/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19138"
BASE_PATH = "/"
